<script>
/* ============================================================
   📊 교사 관리 화면 스크립트
   ============================================================ */

(function () {
  var $ = App.$;
  var on = App.on;
  var adminPassword = "";   // 로그인한 동안만 메모리에 보관합니다.
  var adminRows = [];
  var editingName = "";
  var lastCsv = null;

  /* ---------- 로그인 ---------- */

  function login() {
    var password = $("adminPw").value;
    if (!password) { App.toast("비밀번호를 입력해주세요.", "error"); return; }

    App.overlay(true, "확인하고 있어요...");
    App.call("apiAdminLogin", password).then(function (res) {
      App.overlay(false);
      if (!res.ok) { App.toast(res.message, "error"); return; }
      adminPassword = password;
      $("adminPw").value = "";
      App.showView("admin");
      loadData();
    }).catch(function (err) {
      App.overlay(false);
      App.toast(err.message, "error");
    });
  }

  function logout() {
    adminPassword = "";
    adminRows = [];
    App.showView("home");
  }

  /* ---------- 데이터 불러오기 ---------- */

  function loadData(fnName, message) {
    App.overlay(true, message || "기록을 불러오고 있어요...");
    return App.call(fnName || "apiAdminGetData", adminPassword).then(function (res) {
      App.overlay(false);
      if (!res.ok) {
        App.toast(res.message, "error");
        showTableMessage("기록을 불러오지 못했습니다.\n" + res.message);
        if (res.message.indexOf("비밀번호") >= 0) logout();
        return false;
      }
      render(res.data);
      return true;
    }).catch(function (err) {
      App.overlay(false);
      App.toast(err.message, "error");
      showTableMessage("기록을 불러오지 못했습니다.\n" + err.message);
      return false;
    });
  }

  /** 오류나 안내를 표 안에 계속 보이도록 표시합니다. (토스트는 곧 사라지므로) */
  function showTableMessage(message) {
    var tbody = $("adminTbody");
    if (!tbody) return;
    tbody.innerHTML = "";
    var row = document.createElement("tr");
    var cellEl = document.createElement("td");
    cellEl.colSpan = 15;
    cellEl.className = "table-message";
    cellEl.textContent = message;
    row.appendChild(cellEl);
    tbody.appendChild(row);
  }

  /* ---------- 화면 그리기 ---------- */

  function render(data) {
    adminRows = data.rows;

    $("adminUpdatedAt").textContent = data.updatedAt;
    $("sumTotal").textContent = data.summary.total;
    $("sumBase").textContent = data.summary.baseDone;
    $("sumFinal").textContent = data.summary.finalDone;

    var diag = data.diagnostics;
    var diagEl = $("adminDiag");
    if (diagEl && diag) {
      diagEl.textContent =
        "📄 " + diag.spreadsheet + "  |  학생명단 " + diag.roster + "명 · 기록 시트 " +
        diag.recordRows + "행  |  시트: " + diag.sheets;
    }

    renderAwards(data.awards);
    renderTable(data.rows);
  }

  function renderAwards(awards) {
    function put(nameId, valueId, award, suffix) {
      var hasWinner = award && award.names && award.names.length;
      $(nameId).textContent = hasWinner ? award.names.join(", ") : "-";
      $(valueId).textContent = hasWinner ? App.num(award.value) + suffix : "기록을 마친 학생이 아직 없어요";
    }
    put("awardGrowth", "awardGrowthValue", awards.growthKing, "점");
    put("awardRate", "awardRateValue", awards.rateKing, "% 향상");
    put("awardAccuracy", "awardAccuracyValue", awards.accuracyKing, "% 정확도");
    put("awardSpeed", "awardSpeedValue", awards.speedKing, "타");
  }

  function renderTable(rows) {
    var tbody = $("adminTbody");
    tbody.innerHTML = "";

    if (!rows.length) {
      var emptyRow = document.createElement("tr");
      var emptyCell = document.createElement("td");
      emptyCell.colSpan = 15;
      emptyCell.className = "table-message";
      emptyCell.textContent = "표시할 학생이 없습니다. \u0027학생명단\u0027 시트의 B열에 학생 이름을 넣어주세요.";
      emptyRow.appendChild(emptyCell);
      tbody.appendChild(emptyRow);
      return;
    }

    rows.forEach(function (row) {
      var tr = document.createElement("tr");

      tr.appendChild(cell(row.rank ? String(row.rank) : "-", "rank"));
      tr.appendChild(cell(row.name + (row.notInRoster ? " (명단 밖)" : ""), "name"));
      tr.appendChild(cell(value(row.baseStrokes)));
      tr.appendChild(cell(value(row.baseAccuracy, "%")));
      tr.appendChild(cell(value(row.finalStrokes)));
      tr.appendChild(cell(value(row.finalAccuracy, "%")));
      tr.appendChild(cell(row.hasFinal ? App.signed(row.increase, "타") : "-"));
      tr.appendChild(cell(row.hasFinal ? App.signed(row.rate, "%") : "-"));
      tr.appendChild(cell(row.hasFinal ? App.signed(row.accuracyDelta, "%p") : "-"));
      tr.appendChild(cell(value(row.increaseScore)));
      tr.appendChild(cell(value(row.rateScore)));
      tr.appendChild(cell(value(row.accuracyScore)));
      tr.appendChild(cell(row.hasFinal ? App.num(row.totalScore) + "점" : "-", "score"));

      // 캡처 사진
      var shots = document.createElement("td");
      var shotBox = document.createElement("div");
      shotBox.className = "shot-cell";
      [["base", "🌱 기초", row.baseShot], ["final", "🏁 최종", row.finalShot]].forEach(function (item) {
        if (!item[2]) return;
        var button = document.createElement("button");
        button.className = "mini";
        button.textContent = item[1];
        button.addEventListener("click", function () { openCapture(row.name, item[0]); });
        shotBox.appendChild(button);
      });
      if (!shotBox.childNodes.length) {
        shots.textContent = "-";
        shots.className = "muted";
      } else {
        shots.appendChild(shotBox);
      }
      tr.appendChild(shots);

      var actions = document.createElement("td");
      var box = document.createElement("div");
      box.className = "row-actions";

      var editBtn = document.createElement("button");
      editBtn.className = "mini";
      editBtn.textContent = "수정";
      editBtn.addEventListener("click", function () { openEdit(row.name); });
      box.appendChild(editBtn);

      if (row.hasBase || row.hasFinal) {
        var deleteBtn = document.createElement("button");
        deleteBtn.className = "mini danger";
        deleteBtn.textContent = "삭제";
        deleteBtn.addEventListener("click", function () { removeRecord(row.name); });
        box.appendChild(deleteBtn);
      }

      actions.appendChild(box);
      tr.appendChild(actions);
      tbody.appendChild(tr);
    });
  }

  function cell(text, className) {
    var td = document.createElement("td");
    td.textContent = text;
    if (className) td.className = className;
    if (text === "-") td.classList.add("muted");
    return td;
  }

  function value(v, suffix) {
    if (v === null || v === undefined || v === "") return "-";
    return App.num(v) + (suffix || "");
  }

  /* ---------- 캡처 사진 보기 ---------- */

  function openCapture(name, kind) {
    App.overlay(true, "캡처 사진을 불러오고 있어요...");
    App.call("apiAdminGetCapture", adminPassword, name, kind).then(function (res) {
      App.overlay(false);
      if (!res.ok) { App.toast(res.message, "error"); return; }
      $("shotTitle").textContent = name + " 학생 · " + (kind === "base" ? "기초" : "최종") + " 기록 캡처";
      $("shotImage").src = res.dataUrl;
      $("shotOpenBtn").href = res.url;
      $("shotModal").hidden = false;
    }).catch(function (err) {
      App.overlay(false);
      App.toast(err.message, "error");
    });
  }

  /* ---------- 기록 수정 ---------- */

  function openEdit(name) {
    var row = adminRows.filter(function (r) { return r.name === name; })[0];
    if (!row) return;

    editingName = name;
    $("editTitle").textContent = name + " 학생 기록 수정";
    buildFields("editBaseFields", "eb", row.baseTrials);
    buildFields("editFinalFields", "ef", row.finalTrials);
    $("editModal").hidden = false;
  }

  function buildFields(containerId, prefix, trials) {
    var container = $(containerId);
    container.innerHTML = "";

    for (var i = 1; i <= 3; i++) {
      var trial = (trials && trials[i - 1]) || { strokes: "", accuracy: "" };
      var box = document.createElement("div");
      box.className = "trial";

      var title = document.createElement("div");
      title.className = "trial-title";
      title.textContent = i + "회";
      box.appendChild(title);

      var fields = document.createElement("div");
      fields.className = "fields";
      fields.appendChild(field(prefix + i + "s", "타수", trial.strokes, "numeric"));
      fields.appendChild(field(prefix + i + "a", "정확도", trial.accuracy, "decimal"));
      box.appendChild(fields);

      container.appendChild(box);
    }
  }

  function field(id, labelText, value, mode) {
    var wrap = document.createElement("div");
    wrap.className = "field";

    var label = document.createElement("label");
    label.setAttribute("for", id);
    label.textContent = labelText;
    wrap.appendChild(label);

    var input = document.createElement("input");
    input.type = "text";
    input.id = id;
    input.setAttribute("inputmode", mode);
    input.autocomplete = "off";
    input.value = (value === null || value === undefined) ? "" : String(value);
    wrap.appendChild(input);

    return wrap;
  }

  function collectTrials(prefix) {
    var trials = [];
    for (var i = 1; i <= 3; i++) {
      trials.push({
        strokes: $(prefix + i + "s").value.trim(),
        accuracy: $(prefix + i + "a").value.trim()
      });
    }
    return trials;
  }

  function saveEdit() {
    var payload = {
      base: collectTrials("eb"),
      final: collectTrials("ef")
    };

    $("editSaveBtn").disabled = true;
    App.overlay(true, "기록을 저장하고 있어요...");

    App.call("apiAdminSaveRecord", adminPassword, editingName, payload).then(function (res) {
      App.overlay(false);
      $("editSaveBtn").disabled = false;
      if (!res.ok) { App.toast(res.message, "error"); return; }
      $("editModal").hidden = true;
      render(res.data);
      App.toast(editingName + " 학생의 기록을 저장했습니다.", "success");
    }).catch(function (err) {
      App.overlay(false);
      $("editSaveBtn").disabled = false;
      App.toast(err.message, "error");
    });
  }

  /* ---------- 기록 삭제 ---------- */

  function removeRecord(name) {
    var confirmed = window.confirm(
      name + " 학생의 기록을 정말 삭제할까요?\n\n삭제하면 기초 기록과 최종 기록이 모두 지워지고 되돌릴 수 없습니다."
    );
    if (!confirmed) return;

    App.overlay(true, "기록을 삭제하고 있어요...");
    App.call("apiAdminDeleteRecord", adminPassword, name).then(function (res) {
      App.overlay(false);
      if (!res.ok) { App.toast(res.message, "error"); return; }
      render(res.data);
      App.toast(name + " 학생의 기록을 삭제했습니다.", "success");
    }).catch(function (err) {
      App.overlay(false);
      App.toast(err.message, "error");
    });
  }

  /* ---------- CSV ---------- */

  function fetchCsv(callback) {
    App.overlay(true, "CSV를 만들고 있어요...");
    App.call("apiAdminGetCsv", adminPassword).then(function (res) {
      App.overlay(false);
      if (!res.ok) { App.toast(res.message, "error"); return; }
      lastCsv = res;
      callback(res);
    }).catch(function (err) {
      App.overlay(false);
      App.toast(err.message, "error");
    });
  }

  function downloadCsv() {
    fetchCsv(function (res) {
      try {
        // 엑셀에서 한글이 깨지지 않도록 BOM을 붙입니다.
        var blob = new Blob(["\uFEFF" + res.csv], { type: "text/csv;charset=utf-8;" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = res.filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
        App.toast("CSV를 내려받았어요. 다운로드가 안 되면 [CSV 내용 보기]를 사용하세요.", "success");
      } catch (err) {
        showCsvModal(res.csv);
      }
    });
  }

  function viewCsv() {
    if (lastCsv) { showCsvModal(lastCsv.csv); return; }
    fetchCsv(function (res) { showCsvModal(res.csv); });
  }

  function showCsvModal(csv) {
    $("csvText").value = csv;
    $("csvModal").hidden = false;
  }

  function copyCsv() {
    var area = $("csvText");
    area.removeAttribute("readonly");
    area.select();
    area.setSelectionRange(0, area.value.length);
    var copied = false;
    try { copied = document.execCommand("copy"); } catch (err) { copied = false; }
    area.setAttribute("readonly", "readonly");
    App.toast(copied ? "복사했습니다!" : "복사가 안 되면 직접 선택해서 복사해주세요.", copied ? "success" : "error");
  }

  /* ---------- 이벤트 연결 ---------- */

  document.addEventListener("DOMContentLoaded", function () {
    on("adminLoginBtn", "click", login);
    on("adminPw", "keydown", function (event) {
      if (event.key === "Enter") login();
    });
    on("adminLogoutBtn", "click", logout);

    on("adminRefreshBtn", "click", function () { loadData(); });
    on("adminRecalcBtn", "click", function () {
      loadData("apiAdminRecalculate", "성장점수와 순위를 다시 계산하고 있어요...").then(function (ok) {
        if (ok) App.toast("순위를 다시 계산했습니다.", "success");
      });
    });

    on("adminCsvBtn", "click", downloadCsv);
    on("adminCsvViewBtn", "click", viewCsv);

    on("editCancelBtn", "click", function () { $("editModal").hidden = true; });
    on("editSaveBtn", "click", saveEdit);
    on("csvCloseBtn", "click", function () { $("csvModal").hidden = true; });
    on("shotCloseBtn", "click", function () {
      $("shotModal").hidden = true;
      $("shotImage").removeAttribute("src");
    });
    on("shotModal", "click", function (event) {
      if (event.target === $("shotModal")) {
        $("shotModal").hidden = true;
        $("shotImage").removeAttribute("src");
      }
    });
    on("csvCopyBtn", "click", copyCsv);

    on("editModal", "click", function (event) {
      if (event.target === $("editModal")) $("editModal").hidden = true;
    });
    on("csvModal", "click", function (event) {
      if (event.target === $("csvModal")) $("csvModal").hidden = true;
    });
  });
})();
</script>
