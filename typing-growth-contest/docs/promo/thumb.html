<style>
:root { --ink:#1f2d44; --display:"Black Han Sans","Noto Sans KR",sans-serif; --body:"Noto Sans KR",sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--body); }
.thumb {
  width:1200px; height:630px; display:flex; align-items:center; gap:44px;
  padding:56px 60px; color:var(--ink);
  background:
    radial-gradient(620px 420px at 0% 0%, #e6f0ff 0%, rgba(230,240,255,0) 62%),
    radial-gradient(560px 420px at 100% 100%, #e7f7ee 0%, rgba(231,247,238,0) 60%),
    radial-gradient(520px 380px at 88% 0%, #f1eaff 0%, rgba(241,234,255,0) 58%),
    #f7f9fd;
}
.left { flex:1; }
.eyebrow { font-size:19px; font-weight:700; color:#5b9bf8; margin-bottom:16px; letter-spacing:.04em; }
h1 { font-family:var(--display); font-weight:400; font-size:66px; line-height:1.16; margin-bottom:20px; }
.lead { font-size:24px; line-height:1.55; color:#3d4f6b; }
.lead b { color:#12a37a; }
.lead .strike { color:#9aa8bd; text-decoration:line-through; text-decoration-thickness:3px; }
.tags { display:flex; gap:9px; margin-top:26px; flex-wrap:wrap; }
.tag { background:#fff; border:2px solid #e3e9f3; border-radius:999px; padding:8px 18px; font-size:16px; font-weight:700; color:#46587a; }
.right { flex:0 0 300px; }
.right img { width:100%; border-radius:18px; border:1px solid #e3e9f3; box-shadow:0 18px 44px rgba(31,45,68,.16); display:block; }
</style>
<div class="thumb">
  <div class="left">
    <div class="eyebrow">초등 6학년 학급용 · 구글 스프레드시트 기반</div>
    <h1>⌨️ 우리 반<br>타자 성장대회</h1>
    <p class="lead"><span class="strike">누가 제일 빠른가</span> 가 아니라<br><b>처음의 자기보다 얼마나 자랐는가</b></p>
    <div class="tags">
      <span class="tag">무료</span><span class="tag">구글 계정만</span>
      <span class="tag">설치 20분</span><span class="tag">설명서 · 안내문 포함</span>
    </div>
  </div>
  <div class="right"><img src="m3-result.png" alt="성장 결과 화면"></div>
</div>
