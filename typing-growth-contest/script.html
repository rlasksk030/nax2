<script>
/* ============================================================
   ⌨️ 우리 반 타자 성장대회 – 학생 화면 스크립트
   ============================================================ */

var App = (function () {

  var state = {
    studentName: "",
    hasBase: false,
    hasFinal: false,
    // 학생이 올린 회차별 캡처 (저장 전까지만 화면에 보관)
    capture: { base: [null, null, null], final: [null, null, null] }
  };

  var MAX_CAPTURE_BYTES = 5 * 1024 * 1024;

  /* ---------- 기본 도우미 ---------- */

  function $(id) { return document.getElementById(id); }

  /** 화면 전환 (새로고침 없이 부드럽게) */
  function showView(name) {
    var views = document.querySelectorAll(".view");
    for (var i = 0; i < views.length; i++) views[i].classList.remove("active");
    var target = $("view-" + name);
    if (target) target.classList.add("active");
    $("mainWrap").classList.toggle("wide", name === "admin");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function overlay(show, message) {
    $("overlayMsg").textContent = message || "불러오는 중이에요...";
    $("overlay").hidden = !show;
  }

  var toastTimer = null;
  function toast(message, type) {
    var el = $("toast");
    el.textContent = message;
    el.className = "toast show" + (type ? " " + type : "");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = "toast"; }, 3200);
  }

  /**
   * 요소가 없어도 오류가 나지 않도록 안전하게 이벤트를 연결합니다.
   * (HTML 파일 하나가 비어 있어도 나머지 화면은 계속 동작합니다.)
   */
  function on(id, type, handler) {
    var el = $(id);
    if (el) el.addEventListener(type, handler);
    return el;
  }

  /* ---------- 설치 상태 자가 점검 ---------- */

  var REQUIRED_MARKUP = [
    { file: "index", ids: ["studentSelect", "enterBtn", "view-menu", "view-base", "view-final", "view-saved", "view-result"] },
    { file: "admin", ids: ["view-adminLogin", "adminPw", "adminLoginBtn", "view-admin", "adminTbody", "editModal"] }
  ];

  /** 붙여넣기가 빠진 파일이 있으면 화면 위에 무엇이 문제인지 알려줍니다. */
  function checkSetup() {
    var missing = [];

    REQUIRED_MARKUP.forEach(function (group) {
      var lost = group.ids.filter(function (id) { return !$(id); });
      if (lost.length) missing.push(group.file);
    });

    // style 파일이 비어 있으면 카드의 둥근 모서리가 사라집니다.
    var card = document.querySelector(".card");
    if (card && window.getComputedStyle(card).borderRadius === "0px") missing.push("style");

    if (!missing.length) return true;

    var box = document.createElement("div");
    box.setAttribute("style",
      "margin:0 0 18px;padding:18px 20px;border:2px solid #e0736d;border-radius:14px;" +
      "background:#fff3f2;color:#8c2f2a;font-size:15px;line-height:1.7");
    box.innerHTML =
      "<b>⚠️ Apps Script 파일이 비어 있거나 이름이 다릅니다 : " +
      missing.map(function (f) { return "<code>" + f + "</code>"; }).join(", ") +
      "</b><br>편집기에서 이 이름의 HTML 파일을 만들고 같은 이름 파일의 내용을 붙여넣은 뒤, " +
      "[배포 → 배포 관리 → ✏️ → 버전: 새 버전]으로 다시 배포해주세요.";

    var wrap = document.getElementById("mainWrap") || document.body;
    wrap.insertBefore(box, wrap.firstChild);
    return false;
  }

  /** google.script.run 을 Promise 처럼 사용 */
  function call(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (raw) {
          // 서버는 JSON 문자열로 답합니다. (예전 방식의 객체 응답도 그대로 받습니다)
          if (raw === null || raw === undefined || raw === "") {
            reject(new Error(
              "서버에서 빈 응답이 왔습니다. Code.gs 를 최신 내용으로 붙여넣고 " +
              "[배포 → 배포 관리 → 새 버전]으로 다시 배포했는지 확인해주세요."));
            return;
          }
          if (typeof raw !== "string") { resolve(raw); return; }
          try {
            resolve(JSON.parse(raw));
          } catch (err) {
            reject(new Error("서버 응답을 읽지 못했습니다: " + raw.toString().slice(0, 120)));
          }
        })
        .withFailureHandler(function (err) {
          reject(new Error(err && err.message ? err.message : "서버와 연결하지 못했습니다."));
        });
      runner[fnName].apply(runner, args);
    });
  }

  /* ---------- 숫자 표시 ---------- */

  function num(value) {
    if (value === null || value === undefined || value === "") return "-";
    var n = Number(value);
    if (!isFinite(n)) return "-";
    return (Math.round(n * 10) / 10).toString();
  }

  function signed(value, unit) {
    if (value === null || value === undefined || value === "") return "-";
    var n = Number(value);
    var text = num(Math.abs(n));
    var sign = n > 0 ? "+" : (n < 0 ? "-" : "");
    return sign + text + (unit || "");
  }

  /* ---------- 입력값 검사 (서버에서도 다시 검사합니다) ---------- */

  function readTrials(prefix) {
    var trials = [];
    for (var i = 1; i <= 3; i++) {
      trials.push({
        strokes: $(prefix + i + "s").value.trim(),
        accuracy: $(prefix + i + "a").value.trim()
      });
    }
    return trials;
  }

  function clearTrials(prefix) {
    for (var i = 1; i <= 3; i++) {
      $(prefix + i + "s").value = "";
      $(prefix + i + "a").value = "";
    }
  }

  function validateTrials(trials) {
    for (var i = 0; i < trials.length; i++) {
      var no = (i + 1) + "회";
      var s = trials[i].strokes;
      var a = trials[i].accuracy;

      if (s === "") return no + " 타수가 비어 있어요. 3회 기록을 모두 입력해주세요.";
      if (a === "") return no + " 정확도가 비어 있어요. 3회 기록을 모두 입력해주세요.";
      if (!/^\d+$/.test(s)) return no + " 타수는 0~1000 사이의 숫자로 입력해주세요. (소수점 없이)";
      if (!/^\d+(\.\d+)?$/.test(a)) return no + " 정확도는 0~100 사이의 숫자로 입력해주세요.";
      if (Number(s) < 0 || Number(s) > 1000) return no + " 타수는 0~1000 사이의 숫자로 입력해주세요.";
      if (Number(a) < 0 || Number(a) > 100) return no + " 정확도는 0~100 사이의 숫자로 입력해주세요.";
    }
    return "";
  }

  /* ---------- 캡처 사진 ---------- */

  /**
   * 캡처 사진을 화면에서 미리 줄여서 보냅니다.
   * (큰 사진 그대로 보내면 저장이 느리고 실패할 수 있어요)
   */
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("사진을 읽지 못했어요. 다른 사진으로 해볼까요?")); };
      reader.onload = function () {
        var original = reader.result;
        var image = new Image();
        image.onload = function () {
          try {
            var maxSide = 1600;
            var scale = Math.min(1, maxSide / Math.max(image.width, image.height));
            var canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve({ dataUrl: canvas.toDataURL("image/jpeg", 0.82), mimeType: "image/jpeg" });
          } catch (err) {
            resolve({ dataUrl: original, mimeType: file.type || "image/png" });
          }
        };
        image.onerror = function () { resolve({ dataUrl: original, mimeType: file.type || "image/png" }); };
        image.src = original;
      };
      reader.readAsDataURL(file);
    });
  }

  function pickCapture(kind, trialNo, file) {
    var prefix = (kind === "base" ? "b" : "f") + trialNo;
    if (!file) return;

    if (String(file.type || "").indexOf("image/") !== 0) {
      toast("사진 파일(jpg, png)만 올릴 수 있어요.", "error");
      return;
    }

    overlay(true, "사진을 준비하고 있어요...");
    shrinkImage(file).then(function (result) {
      overlay(false);
      var parts = String(result.dataUrl).split(",");
      var base64 = parts.length > 1 ? parts[1] : "";
      var bytes = Math.floor(base64.length * 3 / 4);

      if (!base64) { toast("사진을 읽지 못했어요. 다시 해볼까요?", "error"); return; }
      if (bytes > MAX_CAPTURE_BYTES) {
        toast("사진이 너무 커요. 화면 일부만 캡처해서 올려주세요.", "error");
        return;
      }

      state.capture[kind][trialNo - 1] = {
        data: base64,
        mimeType: result.mimeType,
        name: file.name || "capture.jpg"
      };

      var preview = $(prefix + "ShotPreview");
      var img = $(prefix + "ShotImg");
      if (img) img.src = result.dataUrl;
      if (preview) preview.hidden = false;
      toast(trialNo + "회 사진을 넣었어요.", "success");
    }).catch(function (err) {
      overlay(false);
      toast(err.message, "error");
    });
  }

  function clearCapture(kind, trialNo) {
    var prefix = (kind === "base" ? "b" : "f") + trialNo;
    state.capture[kind][trialNo - 1] = null;

    var input = $(prefix + "Shot");
    if (input) input.value = "";
    var preview = $(prefix + "ShotPreview");
    if (preview) preview.hidden = true;
    var img = $(prefix + "ShotImg");
    if (img) img.removeAttribute("src");
  }

  function clearAllCaptures(kind) {
    for (var i = 1; i <= 3; i++) clearCapture(kind, i);
  }

  /* ---------- 첫 화면: 학생 명단 ---------- */

  function loadStudents() {
    overlay(true, "학생 명단을 불러오고 있어요...");
    call("apiGetStudents").then(function (res) {
      overlay(false);
      var select = $("studentSelect");
      select.innerHTML = "";

      if (!res.ok) {
        select.innerHTML = '<option value="">명단을 불러오지 못했어요</option>';
        toast(res.message, "error");
        return;
      }
      if (!res.students.length) {
        select.innerHTML = '<option value="">학생 명단이 비어 있어요</option>';
        toast("선생님께 '학생명단' 시트를 확인해 달라고 말씀드려 주세요.", "error");
        return;
      }

      var first = document.createElement("option");
      first.value = "";
      first.textContent = "이름을 선택하세요";
      select.appendChild(first);

      res.students.forEach(function (student) {
        var option = document.createElement("option");
        option.value = student.name;
        option.textContent = (student.number !== "" ? student.number + "번  " : "") + student.name;
        select.appendChild(option);
      });
    }).catch(function (err) {
      overlay(false);
      toast(err.message, "error");
    });
  }

  /* ---------- 메뉴 ---------- */

  function openMenu(name) {
    state.studentName = name;
    $("menuName").textContent = name;
    showView("menu");
    refreshState();
  }

  function refreshState() {
    setBadge("baseBadge", null);
    setBadge("finalBadge", null);
    return call("apiGetStudentState", state.studentName).then(function (res) {
      if (!res.ok) { toast(res.message, "error"); return; }
      state.hasBase = res.hasBase;
      state.hasFinal = res.hasFinal;

      setBadge("baseBadge", res.hasBase);
      setBadge("finalBadge", res.hasFinal);

      // 이미 등록한 기록은 학생이 바꿀 수 없으므로 카드를 잠근 모습으로 보여줍니다.
      setLock("menuBase", res.hasBase,
        res.hasBase
          ? "등록한 기록 " + num(res.baseStrokes) + "타 · 정확도 " + num(res.baseAccuracy) + "%"
          : "대회를 시작할 때 잰 3회 기록");
      setLock("menuFinal", res.hasFinal,
        res.hasFinal
          ? "등록한 기록 " + num(res.finalStrokes) + "타 · 정확도 " + num(res.finalAccuracy) + "%"
          : "대회 마지막 날 잰 3회 기록");

      var resultBadge = $("resultBadge");
      if (resultBadge) {
        resultBadge.className = "badge " + (res.hasFinal ? "done" : "wait");
        resultBadge.textContent = res.hasFinal ? "결과 보기" : "확인하기";
      }
    }).catch(function (err) { toast(err.message, "error"); });
  }

  function setBadge(id, done) {
    var el = $(id);
    if (!el) return;
    if (done === null) { el.className = "badge wait"; el.textContent = "확인 중"; return; }
    el.className = "badge " + (done ? "done" : "todo");
    el.textContent = done ? "🔒 등록 완료" : "아직 안 함";
  }

  /** 등록이 끝난 메뉴 카드를 잠그고, 무엇을 등록했는지 보여줍니다. */
  function setLock(id, locked, subText) {
    var item = $(id);
    if (!item) return;
    item.classList.toggle("is-locked", !!locked);
    var sub = item.querySelector(".sub");
    if (sub) sub.textContent = subText;
  }

  var LOCKED_MESSAGE = "이미 등록해서 바꿀 수 없어요. 고쳐야 하면 선생님께 말씀드려 주세요.";

  /* ---------- 저장 ---------- */

  function saveRecord(kind) {
    var prefix = kind === "base" ? "b" : "f";
    var label = kind === "base" ? "기초" : "최종";
    var trials = readTrials(prefix);

    var message = validateTrials(trials);
    if (message) { toast(message, "error"); return; }

    var button = kind === "base" ? $("saveBaseBtn") : $("saveFinalBtn");
    button.disabled = true;
    overlay(true, "기록을 저장하고 있어요...");

    call(kind === "base" ? "apiSaveBase" : "apiSaveFinal", state.studentName, trials, state.capture[kind])
      .then(function (res) {
        overlay(false);
        button.disabled = false;

        if (!res.ok) {
          toast(res.message, "error");
          if (res.duplicated) refreshState();
          return;
        }

        clearTrials(prefix);
        clearAllCaptures(kind);
        refreshState();

        if (res.warning) toast(res.warning, "error");

        if (kind === "final" && res.result && res.result.state === "done") {
          renderResult(res.result);
          showView("result");
          toast("최종 기록이 저장되었습니다!", "success");
          return;
        }

        $("savedTitle").textContent = label + " 기록이 저장되었습니다.";
        $("savedDesc").textContent = "3회 중 " + res.trialNo + "회 기록(타수의 중간값)이 내 " + label + " 기록이 되었어요." +
          (res.savedShots ? " 캡처 사진 " + res.savedShots + "장도 함께 올라갔어요. 📷" : "");
        $("savedStrokesLabel").textContent = label + " 타수";
        $("savedAccuracyLabel").textContent = label + " 정확도";
        $("savedStrokes").textContent = num(res.strokes);
        $("savedAccuracy").textContent = num(res.accuracy);
        showView("saved");
        toast(label + " 기록이 저장되었습니다!", "success");
      })
      .catch(function (err) {
        overlay(false);
        button.disabled = false;
        toast(err.message, "error");
      });
  }

  /* ---------- 성장 결과 ---------- */

  function openResult() {
    overlay(true, "성장 결과를 계산하고 있어요...");
    call("apiGetMyResult", state.studentName).then(function (res) {
      overlay(false);
      if (!res.ok) { toast(res.message, "error"); return; }
      renderResult(res.result);
      showView("result");
    }).catch(function (err) {
      overlay(false);
      toast(err.message, "error");
    });
  }

  function renderResult(result) {
    $("resultTitle").textContent = "🎉 " + state.studentName + "님의 타자 성장 결과";

    if (!result || result.state !== "done") {
      $("resultBody").hidden = true;
      $("resultEmpty").hidden = false;
      $("resultEmptyMsg").innerHTML = (result && result.state === "base")
        ? "🌱 기초 기록은 <b>" + num(result.baseStrokes) + "타 / " + num(result.baseAccuracy) +
          "%</b> 예요.<br>최종 기록을 등록하면 얼마나 성장했는지 볼 수 있어요!"
        : "아직 등록한 기록이 없어요.<br><b>기초 기록 등록</b>부터 시작해 볼까요?";
      return;
    }

    $("resultEmpty").hidden = true;
    $("resultBody").hidden = false;

    $("rBaseStrokes").textContent = num(result.baseStrokes);
    $("rBaseAccuracy").textContent = num(result.baseAccuracy);
    $("rFinalStrokes").textContent = num(result.finalStrokes);
    $("rFinalAccuracy").textContent = num(result.finalAccuracy);

    $("rIncrease").textContent = signed(result.increase, "타");
    $("rRate").textContent = signed(result.rate, "%");
    $("rAccDelta").textContent = signed(result.accuracyDelta, "%p");

    $("rTotal").textContent = num(result.totalScore);
    $("rScoreDetail").textContent =
      "증가량 " + num(result.increaseScore) + "점 + 향상률 " + num(result.rateScore) +
      "점 + 정확도 " + num(result.accuracyScore) + "점";
    $("rCheer").textContent = cheerMessage(result);
  }

  function cheerMessage(result) {
    if (result.increase <= 0) {
      return "끝까지 도전한 것만으로도 멋져요. 다음엔 더 잘할 수 있어요! 💪";
    }
    if (result.totalScore >= 90) return "와! 처음의 나보다 정말 크게 성장했어요! 🎉";
    if (result.totalScore >= 70) return "처음의 나보다 훨씬 성장했어요! 👏";
    if (result.totalScore >= 50) return "꾸준히 연습한 만큼 잘 자랐어요! 🌱";
    return "조금씩이지만 분명히 나아지고 있어요! 🙂";
  }

  /* ---------- 이벤트 연결 ---------- */

  function bind() {
    on("enterBtn", "click", function () {
      var name = $("studentSelect").value;
      if (!name) { toast("이름을 먼저 선택해주세요.", "error"); return; }
      openMenu(name);
    });

    on("studentSelect", "keydown", function (event) {
      if (event.key === "Enter") $("enterBtn").click();
    });

    on("menuBase", "click", function () {
      if (state.hasBase) {
        toast("기초 기록은 " + LOCKED_MESSAGE, "error");
        return;
      }
      showView("base");
    });

    on("menuFinal", "click", function () {
      if (!state.hasBase) {
        toast("기초 기록을 먼저 등록해주세요.", "error");
        return;
      }
      if (state.hasFinal) {
        toast("최종 기록은 " + LOCKED_MESSAGE, "error");
        return;
      }
      showView("final");
    });

    on("menuResult", "click", openResult);
    on("menuBackBtn", "click", function () { showView("home"); });

    on("saveBaseBtn", "click", function () { saveRecord("base"); });
    on("saveFinalBtn", "click", function () { saveRecord("final"); });

    var backButtons = document.querySelectorAll("[data-back]");
    for (var i = 0; i < backButtons.length; i++) {
      backButtons[i].addEventListener("click", function (event) {
        showView(event.currentTarget.getAttribute("data-back"));
        refreshState();
      });
    }

    on("goAdminBtn", "click", function () { showView("adminLogin"); });
    on("adminLoginBackBtn", "click", function () { showView("home"); });

    // 회차별 캡처 사진 선택 / 지우기
    [["b", "base"], ["f", "final"]].forEach(function (pair) {
      for (var no = 1; no <= 3; no++) {
        (function (trialNo) {
          on(pair[0] + trialNo + "Shot", "change", function (event) {
            pickCapture(pair[1], trialNo, event.target.files && event.target.files[0]);
          });
          on(pair[0] + trialNo + "ShotClear", "click", function () {
            clearCapture(pair[1], trialNo);
          });
        })(no);
      }
    });

    // 숫자만 입력되도록 부드럽게 도와줍니다.
    var inputs = document.querySelectorAll('input[inputmode="numeric"], input[inputmode="decimal"]');
    for (var j = 0; j < inputs.length; j++) {
      inputs[j].addEventListener("input", function (event) {
        var allowDot = event.target.getAttribute("inputmode") === "decimal";
        var cleaned = event.target.value.replace(allowDot ? /[^0-9.]/g : /[^0-9]/g, "");
        if (allowDot) {
          var parts = cleaned.split(".");
          if (parts.length > 2) cleaned = parts[0] + "." + parts.slice(1).join("");
        }
        if (cleaned !== event.target.value) event.target.value = cleaned;
      });
    }
  }

  /** 주소에 ?admin=1 이 있으면 선생님 로그인 화면부터 엽니다. */
  function wantsAdmin() {
    if (document.body.getAttribute("data-start-admin") === "true") return true;
    try {
      return /(^|[?&])admin=(1|true)($|&)/i.test(window.location.search);
    } catch (err) {
      return false;
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    bind();
    checkSetup();
    loadStudents();
    if (wantsAdmin()) {
      showView("adminLogin");
      var input = $("adminPw");
      if (input) input.focus();
    }
  });

  /* 관리 화면 스크립트에서도 쓰는 공용 함수들 */
  return {
    $: $,
    on: on,
    call: call,
    showView: showView,
    overlay: overlay,
    toast: toast,
    num: num,
    signed: signed,
    state: state
  };
})();
</script>
